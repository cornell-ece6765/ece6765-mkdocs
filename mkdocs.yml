#=========================================================================
# mkdocs Configuration
#=========================================================================

site_name:   'ECE 6765 Modern Datacenter Architecture'
site_author: 'Mohammad Alian'
site_url:    'https://cornell-ece6765.github.io/ece6765-mkdocs/'

# Repository

repo_name:   'cornell-ece6765/ece6765-mkdocs'
repo_url:    'https://github.com/cornell-ece6765/ece6765-mkdocs'

# Copyright

copyright:   'Copyright &copy; 2026 Mohammad Alian'

# Configuration

theme:
  name:       'material'
  custom_dir: 'theme/'
  language:   'en'
  favicon:    'img/favicon.ico'
  palette:
    primary:  'red'
    accent:   'indigo'
  features:
    - navigation.tabs
    - navigation.sections
    - content.code.copy

# Extensions

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - pymdownx.extra
  - pymdownx.details
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ['docs']
      check_paths: true
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true

# Extras

extra_css:
  - 'stylesheets/extra.css'

extra_javascript:
  - 'js/extras.js'
  - 'js/mathjax.js'
  - 'https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js'

# Drafts
#
# Listed pages are visible under `mkdocs serve` (with a DRAFT banner) but are
# omitted from `mkdocs build` / `mkdocs gh-deploy` -- so they stay editable
# locally without shipping. To release one, delete its line here, restore its
# entry under `nav:`, and re-link it from docs/index.md.

draft_docs: |
  ece6765-project-m2.md
  ece6765-project-m3.md
  ece6765-project-m4.md

# Pages

nav:

  - 'Home': index.md

  - 'Project':
    - 'Project Overview': ece6765-project-overview.md
    - 'Milestone 1: Baseline Instrumentation and Characterization': ece6765-project-m1.md

  - 'Reference':
    - 'Reference Architecture and API': ece6765-project-arch.md
    - 'Evaluation Harness and Metrics': ece6765-eval-harness.md
    - 'Server and Measurement Guide': ece6765-server-guide.md
    - 'Project Report Guidelines': ece6765-report-guidelines.md
    - 'Git Workflow for Group Repos': ece6765-git-workflow.md
